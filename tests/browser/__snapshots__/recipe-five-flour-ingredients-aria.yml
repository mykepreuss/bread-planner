- banner:
  - heading "Bread Planner" [level=1]
- main:
  - tablist:
    - tab "Schedule"
    - tab "Ingredients" [selected]
  - text: Recipe
  - combobox "Recipe": Five-Flour Sourdough
  - paragraph: All-purpose, red spring, Red Fife, whole wheat and rye.
