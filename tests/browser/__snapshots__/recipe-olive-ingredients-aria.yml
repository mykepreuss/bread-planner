      - spinbutton "Leaven / added flour": "20"
      - text: "%"
      - slider "Adjust leaven / added flour"
      - text: Salt / added flour
      - spinbutton "Salt / added flour": "2"
      - text: "%"
      - slider "Adjust salt / added flour"
      - text: Water reserved for final mix
      - spinbutton "Water reserved for final mix": "6.667"
      - text: "%"
      - slider "Adjust water reserved for final mix"
      - paragraph: The water split is a percentage of total added water.
    - heading "Leaven build" [level=3]:
      - button "Leaven build" [expanded]
    - region "Leaven build":
      - paragraph: Build quantities per 1,000 g added flour. The amounts made scale with your batch. Mature starter is equal weights flour and water. If the build is empty, the leaven is treated as 100% hydration.
