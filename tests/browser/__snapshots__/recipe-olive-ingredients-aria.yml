      - listitem: 3 cups pitted olives, coarsely chopped
      - listitem: 2 cups toasted walnuts or hazelnuts, coarsely chopped (optional)
      - listitem: 2 teaspoons dried herbes de Provence
      - listitem: Grated zest of 1 lemon
