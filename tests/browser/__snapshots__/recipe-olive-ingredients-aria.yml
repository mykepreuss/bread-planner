- banner:
  - heading "Bread Planner" [level=1]
- main:
  - tablist:
    - tab "Schedule"
    - tab "Ingredients" [selected]
  - text: Recipe
  - combobox "Recipe": Tartine Olive
  - paragraph: Original Tartine dough with olives, herbes de Provence, lemon zest and, if you like, toasted nuts, worked in after the first turn. A mix of green and oil-cured black olives works well.
  - tabpanel "Ingredients":
    - text: Your batch Each recipe remembers its own settings. Number of loaves
    - spinbutton "Number of loaves": "2"
    - text: loaves Dough weight per loaf
    - spinbutton "Dough weight per loaf": "985"
    - text: g Total hydration
    - spinbutton "Total hydration": "77"
    - text: "%"
    - slider "Adjust total hydration"
    - paragraph: Includes the flour and water in the leaven used.
    - text: Flour blend Parts set the balance between flours. The gram weights scale to your batch.
    - table:
      - rowgroup:
        - row "Flour Blend parts":
          - columnheader "Flour"
          - columnheader "Blend parts"
      - rowgroup:
        - row "White-bread flour 900 g in this batch · 90% 90 parts":
          - cell "White-bread flour 900 g in this batch · 90%"
          - cell "90 parts":
            - spinbutton "White-bread flour proportion": "90"
            - text: parts
        - row "Whole-wheat flour 100 g in this batch · 10% 10 parts":
          - cell "Whole-wheat flour 100 g in this batch · 10%"
          - cell "10 parts":
            - spinbutton "Whole-wheat flour proportion": "10"
            - text: parts
