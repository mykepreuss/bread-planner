    - region "Quiet hours warning":
      - heading "12 actions need you during quiet hours" [level=2]
      - paragraph: Hands-on work is scheduled after 10:30 PM or before 7:00 AM. Overnight rests are fine.
      - paragraph:
        - text: Start the leaven at 8:15 AM on Monday, Nov 23 and nothing falls in quiet hours.
