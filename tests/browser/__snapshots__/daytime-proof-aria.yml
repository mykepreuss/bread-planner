      - strong: 1 batch
      - text: for 2 loaves.
    - strong: Cold proof, 12h 30m
    - paragraph: Monday, Nov 23 at 7:20 AM to Monday, Nov 23 at 7:50 PM
    - text: Daytime proof with this start time
    - paragraph: Readiness comes before the clock. Wait until the dough is ready, then check the step. Later steps move to match.
    - region "Bake schedule":
      - heading "Bake schedule" [level=2]
      - text: 35h 33m total 0 of 22 steps checked
      - button "Clear checklist" [disabled]
      - status: This cold proof falls within one calendar day. For an overnight ferment, shift your start or finish time so this rest spans the night. The dates below show your current plan.
      - text: Day 1
      - heading "Sunday, Nov 22" [level=3]
      - checkbox "Complete Feed starter"
      - time: 10:00 AM
      - text: Feed starter Up next
      - paragraph: Keep an established starter on its regular feeding routine.
      - text: Next step in 11h
      - checkbox "Complete Start leaven"
      - time: 9:00 PM
      - text: Start leaven
      - paragraph: Mix 28 g mature starter, 71 g Anita's all-purpose flour, 71 g whole-wheat flour and 142 g water. Keep it separate from the autolyse and cover. You use 200 g in the dough and keep 112 g.
      - paragraph:
        - strong: "Ready when:"
        - text: Use when aerated and puffy, and a spoonful floats in room-temperature water. If it sinks, allow more fermentation before mixing.
      - text: Next step in 3h 30m Day 2
      - heading "Monday, Nov 23" [level=3]
      - checkbox "Complete Start autolyse"
      - time: 12:30 AM
      - text: Start autolyse Quiet hours
      - paragraph: Mix Anita's all-purpose flour (800 g), whole-wheat flour (100 g), water (680 g). Cover. Keep the remaining ingredients for the final mix.
      - text: Next step in 1h 30m
      - checkbox "Complete Mix final dough"
      - time: 2:00 AM
      - text: Mix final dough Quiet hours
      - paragraph: Add these after the autolyse. Mix until incorporated.
      - list "Add to the dough":
        - listitem:
          - checkbox "Rye flour 100 g"
          - text: Rye flour 100 g
        - listitem:
          - checkbox "Leaven 200 g"
          - text: Leaven 200 g
        - listitem:
          - checkbox "Salt 20 g"
          - text: Salt 20 g
        - listitem:
          - checkbox "Water 100 g"
          - text: Water 100 g
      - text: Next step in 15 min
      - checkbox "Complete Start bulk fermentation"
      - time: 2:15 AM
      - text: Start bulk fermentation
      - paragraph: Keep covered in a warm place, about 75°F to 80°F / 24°C to 27°C.
      - text: Dough temperature after mixing
      - spinbutton "Dough temperature after mixing"
      - combobox "Temperature unit": °F
      - paragraph: Measure the dough after mixing to estimate how long bulk will take. The plan counts 78°F / 26°C as normal.
      - text: Next step in 30 min
      - checkbox "Complete Turn 1"
      - time: 2:45 AM
      - text: Turn 1 Quiet hours
      - paragraph: With wet hands, stretch and fold all four sides vigorously, then go around a second time. These early turns build the gluten structure.
      - text: Next step in 30 min
      - checkbox "Complete Turn 2"
      - time: 3:15 AM
      - text: Turn 2 Quiet hours
      - paragraph: "Vigorously again: stretch and fold all four sides twice, with wet hands."
      - text: Next step in 30 min
      - checkbox "Complete Turn 3"
      - time: 3:45 AM
      - text: Turn 3 Quiet hours
      - paragraph: "Vigorously again: stretch and fold all four sides twice, with wet hands."
      - text: Next step in 30 min
      - checkbox "Complete Turn 4"
      - time: 4:15 AM
      - text: Turn 4 Quiet hours
      - paragraph: "From here, one round: stretch and fold all four sides once, with wet hands."
      - text: Next step in 30 min
      - checkbox "Complete Turn 5"
      - time: 4:45 AM
      - text: Turn 5 Quiet hours
      - paragraph: Stretch and fold all four sides once, with wet hands.
      - text: Next step in 30 min
      - checkbox "Complete Turn 6"
      - time: 5:15 AM
      - text: Turn 6 Quiet hours
      - paragraph: Stretch and fold all four sides once, with wet hands.
      - text: Next step in 30 min
      - checkbox "Complete Turn 7"
      - time: 5:45 AM
      - text: Turn 7 Quiet hours
      - paragraph: Stretch and fold all four sides once, with wet hands.
      - text: Next step in 30 min
      - checkbox "Complete Cut and preshape"
      - time: 6:15 AM
      - text: Cut and preshape Quiet hours
      - paragraph: Turn the dough out of its container onto your work surface. Cut it into equal pieces and shape each into a taut round.
      - paragraph:
        - strong: "Ready when:"
        - text: Look for a billowy dough and 20% to 30% volume increase.
      - text: Next step in 10 min
      - checkbox "Complete Bench rest"
      - time: 6:25 AM
      - text: Bench rest Quiet hours
      - paragraph: Cover the rounds. Prepare towel-lined baskets dusted with rice flour.
      - text: Next step in 30 min
      - checkbox "Complete Final shape"
      - time: 6:55 AM
      - text: Final shape Quiet hours
      - paragraph: Fold the edges toward the center and roll into a taut round. Place it seam-side up in a prepared basket.
      - text: Next step in 5 min
      - checkbox "Complete Basket rest"
      - time: 7:00 AM
      - text: Basket rest
      - paragraph: Leave the baskets covered at room temperature.
      - text: Next step in 20 min
      - checkbox "Complete Cold proof (daytime)"
      - time: 7:20 AM
      - text: Cold proof (daytime)
      - paragraph: Cover the shaped loaves in their baskets and refrigerate overnight.
      - text: Next step in 12h 30m
      - checkbox "Complete Take both loaves out of the fridge"
      - time: 7:50 PM
      - text: Take both loaves out of the fridge
      - paragraph: Allow the loaves to warm while the oven and pots heat.
      - checkbox "Complete Preheat oven and Dutch oven"
      - time: 7:50 PM
      - text: Preheat oven and Dutch oven
      - paragraph: Place the lidded Dutch oven or pots in the oven and heat to 540°F / 282°C. Use one suitable pot per loaf baked at once.
      - text: Next step in 1h
      - checkbox "Complete Bake covered (both loaves)"
      - time: 8:50 PM
      - text: Bake covered (both loaves)
      - paragraph: Dust the loaf tops. Carefully turn seam-side down into the hot pot, score with a lame or razor, and cover. Reduce oven to 460°F / 238°C.
      - text: Next step in 20 min
      - checkbox "Complete Remove lid"
      - time: 9:10 PM
      - text: Remove lid
      - paragraph: "Remove lid carefully: hot steam can escape. Continue at 460°F / 238°C."
      - paragraph:
        - strong: "Ready when:"
        - text: Bake until the crust is a rich golden brown; extend the uncovered bake if needed.
      - text: Next step in 23 min
      - checkbox "Complete All loaves out of the oven"
      - time: 9:33 PM
      - text: All loaves out of the oven
      - paragraph: Transfer to a wire rack. The base should sound hollow when tapped. Cool each loaf at least 15 minutes before slicing.
