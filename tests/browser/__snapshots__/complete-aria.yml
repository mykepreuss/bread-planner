    - combobox "Loaves baked at once": 2 loaves
    - paragraph:
      - strong: 1 batch
      - text: for 2 loaves.
    - strong: Cold proof, 12h 30m
    - paragraph: Friday, Nov 20 at 7:20 PM to Saturday, Nov 21 at 7:50 AM
    - text: Overnight cold ferment
    - paragraph: Readiness comes before the clock. Wait until the dough is ready, then check the step. Later steps move to match.
    - region "Bake schedule":
      - heading "Bake schedule" [level=2]
      - text: 35h 33m total 22 of 22 steps checked
      - button "Clear checklist"
      - status:
        - text: This plan ended Saturday, Nov 21.
        - button "Plan the next bake"
        - text: to move it to tomorrow and keep every setting.
      - text: Day 1
      - heading "Thursday, Nov 19" [level=3]
      - checkbox "Complete Feed starter" [checked]
      - time: 10:00 PM
      - text: Feed starter
      - group "Done at":
        - text: Done at
        - textbox "Date Feed starter was done": 2026-11-19
        - textbox "Time Feed starter was done": 22:00
      - paragraph: Keep an established starter on its regular feeding routine.
      - text: Next step in 11h Day 2
      - heading "Friday, Nov 20" [level=3]
      - checkbox "Complete Start leaven" [checked]
      - time: 9:00 AM
      - text: Start leaven
      - group "Done at":
        - text: Done at
        - textbox "Date Start leaven was done": 2026-11-20
        - textbox "Time Start leaven was done": 09:00
      - paragraph: Mix 28 g mature starter, 71 g Anita's all-purpose flour, 71 g whole-wheat flour and 142 g water. Keep it separate from the autolyse and cover. You use 200 g in the dough and keep 112 g.
      - paragraph:
        - strong: "Ready when:"
        - text: Use when aerated and puffy, and a spoonful floats in room-temperature water. If it sinks, allow more fermentation before mixing.
      - text: Next step in 30 min
      - checkbox "Complete Start autolyse" [checked]
      - time: 9:30 AM
      - text: Start autolyse
      - group "Done at":
        - text: Done at
        - textbox "Date Start autolyse was done": 2026-11-20
        - textbox "Time Start autolyse was done": 09:30
      - paragraph: Mix Anita's all-purpose flour (800 g), whole-wheat flour (100 g), water (680 g). Cover. Keep the remaining ingredients for the final mix.
      - text: Next step in 4h 30m
      - checkbox "Complete Mix final dough" [checked]
      - time: 2:00 PM
      - text: Mix final dough
      - group "Done at":
        - text: Done at
        - textbox "Date Mix final dough was done": 2026-11-20
        - textbox "Time Mix final dough was done": 14:00
      - paragraph: Add rye flour (100 g), leaven used (200 g), salt (20 g), water (100 g) after the autolyse. Mix until incorporated.
      - text: Next step in 15 min
      - checkbox "Complete Start bulk fermentation" [checked]
      - time: 2:15 PM
      - text: Start bulk fermentation
      - group "Done at":
        - text: Done at
        - textbox "Date Start bulk fermentation was done": 2026-11-20
        - textbox "Time Start bulk fermentation was done": 14:15
      - paragraph: Keep covered in a warm place, about 75°F to 80°F / 24°C to 27°C.
      - text: Dough temperature after mixing
      - spinbutton "Dough temperature after mixing"
      - combobox "Temperature unit": °F
      - paragraph: Measure the dough after mixing to estimate how long bulk will take. The plan counts 78°F / 26°C as normal.
      - text: Next step in 30 min
      - checkbox "Complete Turn 1" [checked]
      - time: 2:45 PM
      - text: Turn 1
      - group "Done at":
        - text: Done at
        - textbox "Date Turn 1 was done": 2026-11-20
        - textbox "Time Turn 1 was done": 14:45
      - paragraph: With wet hands, stretch and fold all four sides vigorously, then go around a second time. These early turns build the gluten structure.
      - text: Next step in 30 min
      - checkbox "Complete Turn 2" [checked]
      - time: 3:15 PM
      - text: Turn 2
      - group "Done at":
        - text: Done at
        - textbox "Date Turn 2 was done": 2026-11-20
        - textbox "Time Turn 2 was done": 15:15
      - paragraph: "Vigorously again: stretch and fold all four sides twice, with wet hands."
      - text: Next step in 30 min
      - checkbox "Complete Turn 3" [checked]
      - time: 3:45 PM
      - text: Turn 3
      - group "Done at":
        - text: Done at
        - textbox "Date Turn 3 was done": 2026-11-20
        - textbox "Time Turn 3 was done": 15:45
      - paragraph: "Vigorously again: stretch and fold all four sides twice, with wet hands."
      - text: Next step in 30 min
      - checkbox "Complete Turn 4" [checked]
      - time: 4:15 PM
      - text: Turn 4
      - group "Done at":
        - text: Done at
        - textbox "Date Turn 4 was done": 2026-11-20
        - textbox "Time Turn 4 was done": 16:15
      - paragraph: "From here, one round: stretch and fold all four sides once, with wet hands."
      - text: Next step in 30 min
      - checkbox "Complete Turn 5" [checked]
      - time: 4:45 PM
      - text: Turn 5
      - group "Done at":
        - text: Done at
        - textbox "Date Turn 5 was done": 2026-11-20
        - textbox "Time Turn 5 was done": 16:45
      - paragraph: Stretch and fold all four sides once, with wet hands.
      - text: Next step in 30 min
      - checkbox "Complete Turn 6" [checked]
      - time: 5:15 PM
      - text: Turn 6
      - group "Done at":
        - text: Done at
        - textbox "Date Turn 6 was done": 2026-11-20
        - textbox "Time Turn 6 was done": 17:15
      - paragraph: Stretch and fold all four sides once, with wet hands.
      - text: Next step in 30 min
      - checkbox "Complete Turn 7" [checked]
      - time: 5:45 PM
      - text: Turn 7
      - group "Done at":
        - text: Done at
        - textbox "Date Turn 7 was done": 2026-11-20
        - textbox "Time Turn 7 was done": 17:45
      - paragraph: Stretch and fold all four sides once, with wet hands.
      - text: Next step in 30 min
      - checkbox "Complete Cut and preshape" [checked]
      - time: 6:15 PM
      - text: Cut and preshape
      - group "Done at":
        - text: Done at
        - textbox "Date Cut and preshape was done": 2026-11-20
        - textbox "Time Cut and preshape was done": 18:15
      - paragraph: Turn the dough out of its container onto your work surface. Cut it into equal pieces and shape each into a taut round.
      - paragraph:
        - strong: "Ready when:"
        - text: Look for a billowy dough and 20% to 30% volume increase.
      - text: Next step in 10 min
      - checkbox "Complete Bench rest" [checked]
      - time: 6:25 PM
      - text: Bench rest
      - group "Done at":
        - text: Done at
        - textbox "Date Bench rest was done": 2026-11-20
        - textbox "Time Bench rest was done": 18:25
      - paragraph: Cover the rounds. Prepare towel-lined baskets dusted with rice flour.
      - text: Next step in 30 min
      - checkbox "Complete Final shape" [checked]
      - time: 6:55 PM
      - text: Final shape
      - group "Done at":
        - text: Done at
        - textbox "Date Final shape was done": 2026-11-20
        - textbox "Time Final shape was done": 18:55
      - paragraph: Fold the edges toward the center and roll into a taut round. Place it seam-side up in a prepared basket.
      - text: Next step in 5 min
      - checkbox "Complete Basket rest" [checked]
      - time: 7:00 PM
      - text: Basket rest
      - group "Done at":
        - text: Done at
        - textbox "Date Basket rest was done": 2026-11-20
        - textbox "Time Basket rest was done": 19:00
      - paragraph: Leave the baskets covered at room temperature.
      - text: Next step in 20 min
      - checkbox "Complete Overnight cold proof" [checked]
      - time: 7:20 PM
      - text: Overnight cold proof
      - group "Done at":
        - text: Done at
        - textbox "Date Overnight cold proof was done": 2026-11-20
        - textbox "Time Overnight cold proof was done": 19:20
      - paragraph: Cover the shaped loaves in their baskets and refrigerate overnight.
      - text: Next step in 12h 30m Day 3
      - heading "Saturday, Nov 21" [level=3]
      - checkbox "Complete Take both loaves out of the fridge" [checked]
      - time: 7:50 AM
      - text: Take both loaves out of the fridge
      - group "Done at":
        - text: Done at
        - textbox "Date Take both loaves out of the fridge was done": 2026-11-21
        - textbox "Time Take both loaves out of the fridge was done": 07:50
      - paragraph: Allow the loaves to warm while the oven and pots heat.
      - checkbox "Complete Preheat oven and Dutch oven" [checked]
      - time: 7:50 AM
      - text: Preheat oven and Dutch oven
      - group "Done at":
        - text: Done at
        - textbox "Date Preheat oven and Dutch oven was done": 2026-11-21
        - textbox "Time Preheat oven and Dutch oven was done": 07:50
      - paragraph: Place the lidded Dutch oven or pots in the oven and heat to 540°F / 282°C. Use one suitable pot per loaf baked at once.
      - text: Next step in 1h
      - checkbox "Complete Bake covered (both loaves)" [checked]
      - time: 8:50 AM
      - text: Bake covered (both loaves)
      - group "Done at":
        - text: Done at
        - textbox "Date Bake covered (both loaves) was done": 2026-11-21
        - textbox "Time Bake covered (both loaves) was done": 08:50
      - paragraph: Dust the loaf tops. Carefully turn seam-side down into the hot pot, score with a lame or razor, and cover. Reduce oven to 460°F / 238°C.
      - text: Next step in 20 min
      - checkbox "Complete Remove lid" [checked]
      - time: 9:10 AM
      - text: Remove lid
      - group "Done at":
        - text: Done at
        - textbox "Date Remove lid was done": 2026-11-21
        - textbox "Time Remove lid was done": 09:10
      - paragraph: "Remove lid carefully: hot steam can escape. Continue at 460°F / 238°C."
      - paragraph:
        - strong: "Ready when:"
        - text: Bake until the crust is a rich golden brown; extend the uncovered bake if needed.
      - text: Next step in 23 min
      - checkbox "Complete All loaves out of the oven" [checked]
      - time: 9:33 AM
      - text: All loaves out of the oven
      - group "Done at":
        - text: Done at
        - textbox "Date All loaves out of the oven was done": 2026-11-21
        - textbox "Time All loaves out of the oven was done": 09:33
      - paragraph: Transfer to a wire rack. The base should sound hollow when tapped. Cool each loaf at least 15 minutes before slicing.
      - text: All batches done. Enjoy your bread.
