  - combobox "Recipe": Preuss House
  - paragraph: Anita's all-purpose flour with whole wheat and rye. Autolyse, then an overnight cold proof.
  - tabpanel "Schedule":
    - text: When are we baking? Plan around
    - combobox "Plan around": Starting the leaven
    - text: Leaven date
    - textbox "Leaven date": 2026-11-20
    - text: Time
    - textbox "Time": 09:00
    - text: Baking complete
